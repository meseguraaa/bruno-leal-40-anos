version: "3.8"
services:
  postgres:
    image: postgres:17
    container_name: sitepessoal-db
    restart: always
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: docker
      POSTGRES_PASSWORD: docker
      POSTGRES_DB: petshop
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
